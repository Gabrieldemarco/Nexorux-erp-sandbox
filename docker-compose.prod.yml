x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexorux-postgres-prod
    environment:
      POSTGRES_DB: nexorux_prod
      POSTGRES_USER: nexorux
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexorux -d nexorux_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: always

  redis:
    image: redis:7-alpine
    container_name: nexorux-redis-prod
    command:
      - sh
      - -c
      - redis-server --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexorux-backend-prod
    expose:
      - "8000"
    environment:
      DEBUG: "false"
      ALGORITHM: HS256
      SECRET_KEY_FILE: /run/secrets/secret_key
      RLS_TENANT_CONTEXT_ENABLED: "true"
      STOCK_ALLOW_NEGATIVE: "false"
      RUN_MIGRATIONS: "true"
      UVICORN_WORKERS: "4"
      LOG_LEVEL: INFO
      TRUSTED_HOSTS: ${NEXORUX_TRUSTED_HOSTS:-localhost,127.0.0.1,nexorux-erp.local,backend}
      CORS_ORIGINS: ${NEXORUX_CORS_ORIGINS:-https://localhost,http://localhost}
      PASSWORD_RESET_URL_BASE: ${PASSWORD_RESET_URL_BASE:-https://localhost/recover-password}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_PASSWORD_FILE: ${SMTP_PASSWORD_FILE:-}
    secrets:
      - db_password
      - redis_password
      - secret_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging
    restart: always

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexorux-celery-prod
    environment:
      DEBUG: "false"
      SECRET_KEY_FILE: /run/secrets/secret_key
      RLS_TENANT_CONTEXT_ENABLED: "true"
      STOCK_ALLOW_NEGATIVE: "false"
      RUN_MIGRATIONS: "false"
      LOG_LEVEL: INFO
    secrets:
      - db_password
      - redis_password
      - secret_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - backend_storage:/app/storage
    entrypoint: ["/app/scripts/entrypoint.sh"]
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=info"]
    logging: *default-logging
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: nexorux-frontend-prod
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging
    restart: always

  caddy:
    image: caddy:2.8-alpine
    container_name: nexorux-caddy-prod
    ports:
      - "80:80"
      - "443:443"
    environment:
      NEXORUX_DOMAIN: ${NEXORUX_DOMAIN:-localhost}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-ops@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    logging: *default-logging
    restart: always

secrets:
  db_password:
    file: ./secrets/db_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  secret_key:
    file: ./secrets/secret_key.txt

volumes:
  postgres_data:
  redis_data:
  backend_storage:
  caddy_data:
  caddy_config:
