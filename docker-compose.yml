version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexorux-postgres
    environment:
      POSTGRES_DB: nexorux_dev
      POSTGRES_USER: nexorux
      POSTGRES_PASSWORD: nexorux123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexorux"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexorux-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: nexorux-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: nexorux-backend
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://nexorux:nexorux123@postgres:5432/nexorux_dev
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
      RLS_TENANT_CONTEXT_ENABLED: "true"
      STOCK_ALLOW_NEGATIVE: "false"
      EMAIL_BACKEND: smtp
      SMTP_ENABLED: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USE_TLS: "false"
      SMTP_USE_SSL: "false"
      SMTP_FROM: noreply@nexorux.local
      PASSWORD_RESET_URL_BASE: http://localhost:3000/recover-password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: nexorux-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
